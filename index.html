<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sample Café System</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: a quiet management desk for the same café. Left rail on tablets and desktops, bottom tab bar on phones.
   A sticky date strip sits under the page title. Content is plain sections and ruled lists; cards are used only for
   charts, live orders and forms. Two chart colours (blue, orange) are validated for colour-blind separation. */
:root{
  --bg:#F6F2EA; --surface:#FFFDF8; --ink:#2B2520; --muted:#6B6157; --line:#E4DBCB; --wash:#EFE6D6;
  --accent:#3B2A20; --on-accent:#FFFDF8;
  --s1:#2a78d6; --s2:#eb6834;
  --ok:#3C8C4A; --ok-t:#1F6B2E; --ok-bg:#E1EEDA;
  --warn:#D69A1A; --warn-t:#855400; --warn-bg:#F7E7BE;
  --crit:#C8483D; --crit-t:#A52A20; --crit-bg:#F6D9D3;
  --scrim:rgba(30,24,18,.5); --shadow:0 -8px 40px rgba(43,37,32,.18); --new:#D9531E; --new-bg:#FCE3D6; --new-t:#9A3412; --info-bg:#DCE8F7; --info-t:#1B4F8F; --sage:#56674A; --panel:#D5DBC3; --porcelain:#FFFDF8; --porcelain-line:#E4DBCB; --coffee:#6A4631; --crema:#9A6B48; --milk:#F4E7D3; --sun:#D1A044;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1613; --surface:#24201B; --ink:#F1EADF; --muted:#B3A798; --line:#3A332B; --wash:#2F2923;
    --accent:#EFE6D6; --on-accent:#1D1915;
    --s1:#3987e5; --s2:#d95926;
    --ok:#5DB36B; --ok-t:#8FD39A; --ok-bg:#243528;
    --warn:#E3AC33; --warn-t:#F0C867; --warn-bg:#3B3119;
    --crit:#E0685D; --crit-t:#F4A199; --crit-bg:#3F2623;
    --scrim:rgba(0,0,0,.6); --shadow:0 -8px 40px rgba(0,0,0,.5); --new:#F07A4A; --new-bg:#4A2A1D; --new-t:#FFB596; --info-bg:#1F3047; --info-t:#9CC3F2; --sage:#A9BA93; --panel:#39422F; --porcelain:#EFE6D6; --porcelain-line:#CFC3AF; --coffee:#5E3F2C; --crema:#8A5E3F; --milk:#F4E7D3; --sun:#D9AE5B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1613; --surface:#24201B; --ink:#F1EADF; --muted:#B3A798; --line:#3A332B; --wash:#2F2923;
  --accent:#EFE6D6; --on-accent:#1D1915;
  --s1:#3987e5; --s2:#d95926;
  --ok:#5DB36B; --ok-t:#8FD39A; --ok-bg:#243528;
  --warn:#E3AC33; --warn-t:#F0C867; --warn-bg:#3B3119;
  --crit:#E0685D; --crit-t:#F4A199; --crit-bg:#3F2623;
  --scrim:rgba(0,0,0,.6); --shadow:0 -8px 40px rgba(0,0,0,.5); --new:#F07A4A; --new-bg:#4A2A1D; --new-t:#FFB596; --info-bg:#1F3047; --info-t:#9CC3F2; --sage:#A9BA93; --panel:#39422F; --porcelain:#EFE6D6; --porcelain-line:#CFC3AF; --coffee:#5E3F2C; --crema:#8A5E3F; --milk:#F4E7D3; --sun:#D9AE5B;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p,ul,ol,fieldset,figure{margin:0;padding:0}
ul,ol{list-style:none}
fieldset{border:0;min-width:0}
:focus-visible{outline:3px solid var(--s1);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* shell */
.app{min-height:100vh}
.side{display:none}
.main{min-width:0}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px max(4px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border:0;background:transparent;border-radius:12px;font-size:.68rem;font-weight:500;color:var(--muted);padding:4px 0}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink);font-weight:600;background:var(--wash)}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:240px minmax(0,1fr)}
  .tabbar{display:none}
  .side{display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;height:100dvh;padding:26px 16px 20px max(20px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface)}
}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;flex:none}
.m-bg{fill:var(--accent)}.m-cup{fill:var(--on-accent)}
.m-line{fill:none;stroke:var(--on-accent);stroke-width:2.4;stroke-linecap:round}
.brand b{display:block;font-family:var(--display);font-size:1.15rem;line-height:1.1;letter-spacing:-.01em}
.brand span{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border:0;border-radius:12px;background:transparent;font-weight:500;text-align:left;color:var(--muted)}
.nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav button:hover{background:var(--wash);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.side-foot{margin-top:auto;font-size:.82rem;color:var(--muted)}

/* page head + date strip */
.phead{padding-block:22px 6px}
.phead .pad{display:block}
.ph{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,6vw,2.3rem);letter-spacing:-.025em;line-height:1.1}
.pd{margin-top:4px;color:var(--muted);max-width:62ch}
.sample{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:12px;background:var(--wash);font-size:.88rem;margin-top:14px;max-width:760px}
.sample b{font-weight:600}
.filterbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-top:10px}
.fb{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:10px}
[hidden]{display:none!important}
.seg{display:flex;gap:2px;padding:3px;background:var(--wash);border-radius:999px;width:100%}
@media (min-width:700px){.seg{width:auto}.seg button{padding:0 16px!important}}
.seg button{flex:1;min-height:40px;padding:0 6px;border:0;border-radius:999px;background:transparent;font-weight:500;white-space:nowrap;font-size:.94rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.rangelabel{font-weight:600;font-variant-numeric:tabular-nums}
.custom{display:flex;gap:10px;flex-wrap:wrap;width:100%}
.custom label{display:flex;flex-direction:column;gap:2px;font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.custom input{min-height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:1rem;letter-spacing:0;text-transform:none;font-weight:400;color:var(--ink)}
@media (min-width:700px){.custom{width:auto}}

main{padding-block:20px 120px}
@media (min-width:900px){main{padding-block:24px 56px}}
.stack{display:flex;flex-direction:column;gap:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:-.015em;line-height:1.2}
.sub{color:var(--muted);font-size:.9rem}
.linkbtn{border:0;background:transparent;color:var(--s1);font-weight:600;min-height:40px;padding:0 4px;text-decoration:underline;text-underline-offset:3px}
.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.cols.two{grid-template-columns:repeat(2,minmax(0,1fr))}.cols.wide{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1200px){.tiles{grid-template-columns:repeat(6,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.tl{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tv{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,6vw,2.1rem);letter-spacing:-.02em;line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums}
.ts{margin-top:2px;font-size:.84rem;color:var(--muted)}
.tv.warn{color:var(--warn-t)}.tv.crit{color:var(--crit-t)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.card h3{font-family:var(--display);font-weight:700;font-size:1.1rem;letter-spacing:-.01em;line-height:1.25}
.cc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.tbl-btn{flex:none;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:transparent;font-weight:500;font-size:.88rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:6px;font-size:.88rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid var(--s1);border-radius:2px}
.legend i.b{border-top-color:var(--s2);border-top-style:dashed}
.chart{position:relative;width:100%;min-height:200px}
.chart svg{display:block;touch-action:pan-y;overflow:visible}
.ax{font-size:11px;fill:var(--muted);font-family:var(--body);font-variant-numeric:tabular-nums}
.grid{stroke:var(--line);stroke-width:1}
.base{stroke:var(--muted);stroke-width:1;opacity:.5}
.tip{position:absolute;z-index:3;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:10px;font-size:.84rem;line-height:1.35;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.tip b{display:block;font-weight:600;margin-bottom:2px}
.tip span{display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.tip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.tscroll{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface);position:sticky;top:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:600;background:var(--wash)}
.cmp{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px}
.cmp label{display:flex;flex-direction:column;gap:2px;font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.cmp input{min-height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:1rem;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink)}
.cmpsum{margin-top:12px;display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.cmpsum div{padding:12px 14px;border-radius:14px;background:var(--wash);font-size:.92rem}
.cmpsum b{display:block;font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}

/* stat strip */
.strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px;padding:4px 0}
@media (min-width:700px){.strip{grid-template-columns:repeat(4,minmax(0,1fr))}}
.strip div{min-width:0}
.strip .tv{font-size:1.7rem;margin-top:2px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap}
.pill svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pill.ok{background:var(--ok-bg);color:var(--ok-t)}
.pill.low{background:var(--warn-bg);color:var(--warn-t)}
.pill.out{background:var(--crit-bg);color:var(--crit-t)}
.pill.neutral{background:var(--wash);color:var(--muted)}
.pill.blue{background:var(--wash);color:var(--ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:40px;padding:0 14px;font-size:.9rem}
.btn[disabled]{opacity:.55;cursor:default}
.btn:active{transform:scale(.985)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.note{padding:12px 16px;border-radius:14px;background:var(--wash);font-size:.92rem;max-width:80ch}
.note b{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span,.chipbtn{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:500}
.chip input:checked+span,.chipbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.chip input:focus-visible+span{outline:3px solid var(--s1);outline-offset:2px}
.chipbtn{cursor:pointer}

/* lists */
.ruled>li{border-bottom:1px solid var(--line)}
.ord{display:flex;justify-content:space-between;gap:14px;padding:14px 0;align-items:flex-start}
.ord-h b{font-family:var(--display)}
.ord-h span{color:var(--muted)}
.ord-i{margin-top:2px;font-size:.94rem}
.ord-m{margin-top:2px;font-size:.84rem;color:var(--muted)}
.ord-act{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.empty{padding:20px 0;color:var(--muted)}
.rs{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0}
.rs b{font-family:var(--display)}
.rs p{font-size:.88rem;color:var(--muted)}
.rank{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;align-items:center}
.rank .n{font-family:var(--display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.rank .nm{font-weight:600;min-width:0}
.rank .nm small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.rank .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.rank .v small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.rank .bar{grid-column:2/-1;height:6px;border-radius:99px;background:var(--wash);overflow:hidden}
.rank .bar i{display:block;height:100%;background:var(--s1);border-radius:99px;min-width:2px}
.rank.least .bar i{background:var(--s2)}
.tabs-sort{display:flex;gap:8px;flex-wrap:wrap}

/* stock rows */
.sgroup{margin-top:8px;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:14px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name pill" "level level" "act act";gap:10px 12px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}
.sname{grid-area:name;min-width:0}
.sname b{font-family:var(--display);font-size:1.05rem}
.sname small{display:block;color:var(--muted);font-size:.82rem}
.sname small.due{color:var(--warn-t)}
.spill{grid-area:pill;justify-self:end}
.slevel{grid-area:level;min-width:0}
.slevel .q{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;font-variant-numeric:tabular-nums}
.slevel .q b{font-family:var(--display);font-size:1.3rem}
.slevel .q span{color:var(--muted);font-size:.88rem;align-self:flex-end}
.meter{position:relative;height:8px;border-radius:99px;background:var(--wash)}
.meter i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.meter.low i{background:var(--warn)}.meter.out i{background:var(--crit)}
.meter b{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;border-radius:2px}
.sact{grid-area:act;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:900px){
  .srow{grid-template-columns:minmax(0,1.3fr) minmax(0,1.5fr) 120px auto;grid-template-areas:"name level pill act";gap:20px}
  .sact{display:flex}
}
.sugg{font-size:.84rem;color:var(--muted)}
.mv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 0}
.mv b{font-weight:600}
.mv .d{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.mv .d.plus{color:var(--ok-t)}.mv .d.minus{color:var(--crit-t)}
.mv small{color:var(--muted);font-size:.84rem}

/* recipes */
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:14px 0;align-items:center}
.rrow b{font-family:var(--display)}
.rrow small{display:block;color:var(--muted);font-size:.86rem}
.ing{display:grid;grid-template-columns:minmax(0,1fr) 92px 44px;gap:8px;align-items:end;margin-top:10px}
.ing .u{font-size:.8rem;color:var(--muted);grid-column:1/-1;margin-top:-4px}
.ing button{width:44px;height:48px;border:1px solid var(--line);border-radius:12px;background:transparent}

/* report */
.rep-note{font-size:.88rem;color:var(--muted)}

/* toast + sheet */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.92rem;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}
@media (min-width:900px){.toast{bottom:28px}}
.scrim{position:fixed;inset:0;z-index:45;background:var(--scrim)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);color:var(--ink);border-radius:24px 24px 0 0;box-shadow:var(--shadow);animation:rise .26s ease-out}
.sheet:focus{outline:0}
@keyframes rise{from{transform:translateY(36px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:720px){
  .sheet{left:50%;right:auto;top:50%;bottom:auto;width:520px;max-height:88vh;border-radius:24px;transform:translate(-50%,-50%);animation:fade .18s ease-out}
  @keyframes fade{from{opacity:0}to{opacity:1}}
}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.btn:active{transform:none}}
.sheet-in{padding:20px max(20px,env(safe-area-inset-left,0px)) 0 max(20px,env(safe-area-inset-right,0px))}

.phone-screen{position:relative;background:linear-gradient(#4a3a30,#1d1815);border:6px solid #111;border-radius:36px;padding:34px 14px 26px;color:#fff;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.ph-notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:76px;height:20px;border-radius:99px;background:#000}
.ph-time{font-size:3.4rem;font-weight:300;line-height:1;margin:10px 0 2px;letter-spacing:-.02em}
.ph-date{font-size:.95rem;opacity:.85;margin:0 0 22px}
.ph-note{display:flex;gap:10px;text-align:left;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);border-radius:18px;padding:12px}
.ph-ic{flex:none;width:34px;height:34px;border-radius:9px;background:#fffaf0;display:grid;place-items:center;overflow:hidden}
.ph-ic svg{width:26px;height:26px}
.ph-tx{min-width:0;flex:1}
.ph-h{display:flex;justify-content:space-between;gap:8px;font-size:.9rem}
.ph-h span{opacity:.75}
.ph-note p,.ph-p{margin:2px 0 0;font-size:.92rem;line-height:1.35;display:block}
.phone figcaption{font-size:.85rem;text-align:center;margin-top:8px;opacity:.75}
.track{display:flex;list-style:none;padding:0;margin:18px 0 8px;gap:4px}
.track li{flex:1;text-align:center;font-size:.85rem;font-weight:600;position:relative;opacity:.55}
.track li i{display:grid;place-items:center;width:30px;height:30px;margin:0 auto 6px;border-radius:50%;border:2px solid var(--line);font-style:normal;background:var(--surface);position:relative;z-index:1}
.track li:not(:first-child)::before{content:"";position:absolute;top:14px;right:50%;width:100%;height:2px;background:var(--line)}
.track li.done,.track li.now{opacity:1}
.track li.done i{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.track li.done::before,.track li.now::before{background:var(--accent)}
.track li.now i{border-color:var(--accent);box-shadow:0 0 0 4px rgba(217,90,38,.18)}
.track-msg{text-align:center;font-weight:600;margin:6px 0 4px}
.track-x{padding:12px;border-radius:12px;background:var(--wash);margin:14px 0}
.smsnote{text-align:center;margin:10px 0}
.ctrackbar{background:var(--accent);color:var(--on-accent);font-size:1rem}
.ctrackbar.ready{background:var(--ok-t,#1f6b41)}
.ctrackbar[hidden]{display:none}
.ctrack-in{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px}
.ctrackbar .linkbtn{color:inherit;text-decoration:underline;font-weight:700;min-height:44px}
.push{position:fixed;z-index:300;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));max-width:420px;margin-inline:auto;animation:pushin .55s cubic-bezier(.2,.9,.3,1.08)}

.push-x{position:absolute;top:2px;right:2px;width:44px;height:44px;border:0;background:none;font-size:1.5rem;color:#1d1815;opacity:.5}
@keyframes pushin{from{transform:translateY(-140%) scale(.96);opacity:0}to{transform:none;opacity:1}}

/* web push */
.oc-sms.bad{background:rgba(190,60,50,.14);color:#a02f27}

.oc-ready{margin-top:6px;min-height:48px}

  /* ---------- events ---------- */
  document.addEventListener('click', function (ev) {
    var t = ev.target, el;
    if ((el = t.closest('#seg [data-preset]'))) { UI.preset = el.getAttribute('data-preset'); if (UI.preset === 'custom' && UI.from === UI.to && UI.from === TODAY) { UI.from = addDays(TODAY, -6); UI.to = TODAY; } render(); return; }

    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id'), sh = UI.sheet;

      case 'close': closeSheet(); break;
      case 'toggle-chart': chartMode[id] = chartMode[id] === 'table' ? 'chart' : 'table'; el.textContent = chartMode[id] === 'table' ? 'Show chart' : 'Show table'; el.setAttribute('aria-pressed', chartMode[id] === 'table'); drawAll(); break;
      case 'o-open': openSheet({ type: 'order', id: +id }); break;
      case 'o-next': { var o1 = orderById(+id); if (o1 && NEXT[o1.status]) changeStatus(o1, NEXT[o1.status][0]); break; }
      case 'o-ready': { var o0 = orderById(+id); if (o0 && (o0.status === 'new' || o0.status === 'preparing')) changeStatus(o0, 'ready'); break; }

      case 'sim': simulate(); break;

      case 'to-cust-table': { var n = +$('#custTable').value; location.hash = 'table-' + n + '-' + (areaOf(n) === 'Inside' ? 'inside' : 'beer-garden'); break; }
      case 'c-staff': if (UI.sheet) closeSheet(); location.hash = 'orders'; break;
      case 'st-update': openSheet({ type: 'supdate', id: id || (S.stock[0] && S.stock[0].id), mode: 'delivery' }); break;
      case 'st-edit': openSheet({ type: 'sedit', id: id }); break;
      case 'st-add': openSheet({ type: 'sedit', id: null }); break;
      case 'st-hist': openSheet({ type: 'shist', id: id }); break;
      case 'save-update': saveUpdate(); break;
      case 'save-sedit': saveSEdit(); break;
      case 'del-stock':
        if (!sh.confirmDel) { sh.confirmDel = true; var k = snapshotForm(); renderSheet(); restoreForm(k); }
        else { var gone = stockBy(sh.id); logMove(gone, -gone.q, 'removed', 'Item deleted'); S.stock = S.stock.filter(function (i) { return i.id !== sh.id; }); S.menu.forEach(function (m) { if (m.rec) { m.rec.ing = m.rec.ing.filter(function (g) { return g.s !== sh.id; }); if (!m.rec.ing.length) m.rec = null; } }); save(); closeSheet(); render(); toast('Stock item deleted. Its history is kept.'); }
        break;
      case 'm-add': openSheet({ type: 'menu', id: null, draft: { n: '', d: '', c: 'Food', g: '', p: 10, staff: false, av: true, o: [], rec: { on: true, ing: [] } } }); break;
      case 'm-edit': { var mi = menuBy(id); openSheet({ type: 'menu', id: id, draft: { n: mi.n, d: mi.d, c: mi.c, g: mi.g, p: mi.p, staff: mi.staff, av: mi.av, o: mi.o, rec: mi.rec ? JSON.parse(JSON.stringify(mi.rec)) : { on: true, ing: [] } } }); break; }
      case 'm-toggle': { var mt = menuBy(id); mt.av = !mt.av; save(); render(); toast(mt.n + (mt.av ? ' is available again.' : ' is now shown as Sold out.')); break; }
      case 'add-ing': syncDraft(); sh.draft.rec.ing.push({ s: S.stock[0] ? S.stock[0].id : '', q: 1 }); { var kk = snapshotForm(); renderSheet(); restoreForm(kk); } break;
      case 'rm-ing': syncDraft(); sh.draft.rec.ing.splice(+el.getAttribute('data-i'), 1); renderSheet(); break;
      case 'save-menu': saveMenu(); break;
      case 'del-menu':
        if (!sh.confirmDel) { sh.confirmDel = true; var k2 = snapshotForm(); renderSheet(); restoreForm(k2); }
        else { S.menu = S.menu.filter(function (m) { return m.id !== sh.id; }); save(); closeSheet(); render(); toast('Menu item deleted.'); }
        break;
      case 'download': doDownload(); break;
      case 'copycsv': copyCSV(); break;
      case 'set-save': {
        var nm = $('#setName').value.trim() || 'Sample Café', ins = parseInt($('#setIn').value, 10), ga = parseInt($('#setGa').value, 10), pr = parseInt($('#setPrep').value, 10);
        if (!(ins >= 1) || !(ga >= 0) || !(pr >= 1)) { toast('Check the table counts and wait time. Inside needs at least 1 table.'); break; }
        S.name = nm; S.set.inside = ins; S.set.garden = ga; S.set.prep = pr; save(); rebuild(); render(); toast('Settings saved.'); break;
      }
      case 'perm-yes': answerPerm(true); break;
      case 'perm-no': answerPerm(false); break;
      case 'push-replay': { var po = C.last && orderById(C.last.id); if (po) { showPush(po); } break; }
      case 'push-on': enablePush(); break;
      case 'sms-retry': retryPush(+id); break;
      case 'push-test': testPush(); break;
      case 'push-save': { var pu = ($('#pushUrl').value || '').trim().replace(/\/+$/, ''), pt = ($('#pushTok').value || '').trim(); if (!pu && !pt) { S.set.pushUrl = ''; S.set.pushToken = ''; save(); render(); toast('Push server removed. Notifications are simulated.'); break; } if (!/^https:\/\//i.test(pu) && !/^http:\/\/localhost/i.test(pu)) { toast('The address must start with https://'); break; } if (!pt) { toast('Enter the staff token.'); break; } S.set.pushUrl = pu; S.set.pushToken = pt; save(); render(); toast('Push server saved.'); break; }
      case 'push-off': S.set.pushUrl = ''; S.set.pushToken = ''; save(); render(); toast('Disconnected. Notifications are simulated.'); break;
      case 'set-sound': S.set.sound = !S.set.sound; save(); render(); if (S.set.sound) beep(); break;
      case 'set-auto': S.set.auto = !S.set.auto; save(); render(); break;
      case 'set-beep': beep(); break;
      case 'clear-sample':
        if (UI.confirm !== 'clear') { UI.confirm = 'clear'; render(); }
        else { UI.confirm = null; S.cleared = true; S.live = S.live.filter(function (o) { return !o.sample; }); S.moves = S.moves.filter(function (m) { return !m.sample; }); var ids = {}; S.stock = S.stock.filter(function (i) { if (i.sample) { ids[i.id] = 1; return false; } return true; }); S.menu.forEach(function (m) { if (m.rec) { m.rec.ing = m.rec.ing.filter(function (g) { return !ids[g.s]; }); if (!m.rec.ing.length) m.rec = null; } }); save(); rebuild(); render(); toast('Sample data removed. Live records are untouched.'); }
        break;
      case 'reset-all':
        if (UI.confirm !== 'reset') { UI.confirm = 'reset'; render(); }
        else { UI.confirm = null; S = freshStore(); save(); rebuild(); C.cart = []; render(); toast('Everything is back to the sample data.'); }
        break;
      /* customer */
      case 'c-add': { var ci = menuBy(id); if (!ci || ci.staff || !ci.av) break; if (ci.o && ci.o.length) { C.pending = { item: ci, sel: {}, qty: 1 }; openSheet({ type: 'c-opts' }); } else { cartAdd(ci, {}, 1); toast('Added ' + ci.n); } break; }
      case 'c-cart': openSheet({ type: 'c-cart' }); break;
      case 'pq-inc': C.pending.qty = Math.min(20, C.pending.qty + 1); $('#pq').textContent = C.pending.qty; $('#addConfirm').textContent = 'Add to order · ' + m2(pendingCents() / 100); break;
      case 'pq-dec': C.pending.qty = Math.max(1, C.pending.qty - 1); $('#pq').textContent = C.pending.qty; $('#addConfirm').textContent = 'Add to order · ' + m2(pendingCents() / 100); break;
      case 'c-confirm': { var p = C.pending; cartAdd(p.item, p.sel, p.qty); closeSheet(); toast('Added ' + p.item.n); break; }
      case 'c-inc': { var i1 = +el.getAttribute('data-i'); C.cart[i1].qty = Math.min(20, C.cart[i1].qty + 1); updateCust(); renderSheet(); var f1 = $('[data-act="c-inc"][data-i="' + i1 + '"]'); if (f1) f1.focus(); break; }
      case 'c-dec': { var i2 = +el.getAttribute('data-i'); C.cart[i2].qty -= 1; var gone2 = C.cart[i2].qty <= 0; if (gone2) C.cart.splice(i2, 1); updateCust(); renderSheet(); var f2 = gone2 ? $('[data-act="close"]') : $('[data-act="c-dec"][data-i="' + i2 + '"]'); if (f2) f2.focus(); break; }
      case 'c-edit-table': C.editTable = true; renderSheet(); { var ts = $('#tableSel'); if (ts) ts.focus(); } break;
      case 'c-place': placeOrder(); break;
      case 'c-status': { var pp = $('#push'); if (pp) pp.remove(); if (C.last) openSheet({ type: 'c-done' }); break; }
      case 'push-close': { var pq = $('#push'); if (pq) pq.remove(); break; }
    }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'dFrom' || t.id === 'dTo') { if (t.value) { if (t.id === 'dFrom') UI.from = t.value; else UI.to = t.value; render(); } }
    else if (t.id === 'cmpA' || t.id === 'cmpB') { if (t.value) { UI[t.id] = t.value; render(); var f = document.getElementById(t.id); if (f) f.focus(); } }
    else if (t.id === 'hItem') { UI.shist = t.value; render(); var h2 = $('#hItem'); if (h2) h2.focus(); }
    else if (t.id === 'uItem' || t.name === 'uMode') { updatePrev(); }
    else if (t.name && t.name.indexOf('opt-') === 0 && C.pending && UI.sheet && UI.sheet.type === 'c-opts') {
      var gid = t.name.slice(4); if (t.type === 'checkbox') C.pending.sel[gid] = $$('input[name="' + t.name + '"]:checked').map(function (x) { return +x.value; }); else C.pending.sel[gid] = +t.value;
      $('#addConfirm').textContent = 'Add to order · ' + m2(pendingCents() / 100);
    } else if (t.id === 'heroTable' || t.id === 'tableSel') { var v = +t.value; C.table = v ? { n: v, area: areaOf(v) } : null; C.editTable = false; var er = $('#cErr'); if (er) er.hidden = true; if (UI.sheet && UI.sheet.type === 'c-cart') { renderSheet(); } updateCust(); }
    else if (t.id && t.id.indexOf('rS') === 0 && UI.sheet && UI.sheet.type === 'menu') { syncDraft(); var kk = snapshotForm(); renderSheet(); restoreForm(kk); }
  });
  document.addEventListener('input', function (ev) {
    var id = ev.target.id;
    if (id === 'cNotify') C.notify = ev.target.checked; else if (id === 'custName') C.name = ev.target.value; else if (id === 'custNote') C.note = ev.target.value; else if (id === 'uQty') updatePrev();
  });
  function updatePrev() {
    if (!$('#uPrev')) return;
    var it = stockBy($('#uItem').value), md = ($('input[name="uMode"]:checked') || {}).value, q = parseFloat($('#uQty').value);
    $('#uUnit').textContent = '(' + it.u + ')'; $('#uWhyBox').hidden = !(md === 'inc' || md === 'dec'); $('#uQtyL').firstChild.textContent = (md === 'set' ? 'Counted amount' : 'Quantity') + ' ';
    var nx = isNaN(q) ? null : md === 'set' ? q : md === 'dec' ? it.q - q : it.q + q;
    $('#uPrev').textContent = nx === null ? 'Now ' + qf(it.q) + ' ' + it.u + '.' : nx < 0 ? 'That would take stock below zero.' : 'Now ' + qf(it.q) + ' ' + it.u + '. After this update: ' + qf(nx) + ' ' + it.u + '.';
  }
  document.addEventListener('keydown', function (e) {
    if (!UI.sheet) return;
    if (e.key === 'Escape') { closeSheet(); return; }
    if (e.key === 'Tab') {
      var f = $$('#sheet button, #sheet input, #sheet select, #sheet textarea, #sheet [tabindex="-1"]').filter(function (n) { return !n.disabled && n.offsetParent !== null; });
      if (!f.length) return; var first = f[0], last = f[f.length - 1];
      if (!$('#sheet').contains(document.activeElement)) { e.preventDefault(); first.focus(); }
      else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  /* ---------- routing and boot ---------- */
  function go(p) { if (location.hash.slice(1) === p) { UI.page = p; UI.mode = 'staff'; render(); window.scrollTo(0, 0); } else location.hash = p; }
  function fromHash() {
    var h = location.hash.slice(1), tb = parseTable(h);

    window.scrollTo(0, 0);
  }

  function renderCustFull() { $('#staff').hidden = true; $('#tabbar').hidden = true; $('#cust').hidden = false; renderCust(); updateBadges(); }
  function render() {
    if (UI.mode === 'cust') { updateCust(); updateBadges(); return; }
    $('#staff').hidden = false; $('#tabbar').hidden = false; $('#cust').hidden = true;
    renderStaff(); updateBadges();
  }
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(drawAll, 150); });
  window.addEventListener('hashchange', fromHash);
  window.addEventListener('storage', function (e) {
    if (e.key !== KEY) return; var d = readStore(); if (!d) return;
    var known = {}; S.live.forEach(function (o) { known[o.id] = 1; }); S = d; rebuild();
    var fresh = S.live.filter(function (o) { return !known[o.id] && o.status === 'new'; });

    else if (UI.mode === 'cust') { renderCust(); if (UI.sheet && UI.sheet.type === 'c-done') renderSheet(); }
  });

  var firstRun = !readStore(); S = readStore() || freshStore(); if (firstRun) save(); genSample(); rebuild(); buildNav();
  try { var mine = JSON.parse(localStorage.getItem('sample-cafe-mine') || 'null'); if (mine) { C.phone = mine.phone || ''; var mo = orderById(mine.id); if (mo) C.last = mo; } } catch (e) {}
  fromHash();
  try { if (window.claude && window.claude.use) window.claude.use('downloads').then(function (d) { dl = d || null; if (UI.mode === 'staff' && UI.page === 'reports') render(); }, function () { dl = null; }); else dl = null; } catch (e) { dl = null; }

})();
